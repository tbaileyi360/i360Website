<section class="page-hero">
  <div class="container-site relative z-[1]">
    <h1>Our Leadership</h1>
    <p>
      i360 is led by an experienced executive team that has worked together since our inception in
      2001.
    </p>
  </div>
</section>

<section class="section-y">
  <div class="container-site grid grid-cols-1 gap-5 md:grid-cols-3">
    @for (leader of leaders; track leader.name) {
      <article class="rounded-[20px] border border-line bg-surface px-6 py-7">
        <div
          class="mb-4 grid h-[3.25rem] w-[3.25rem] place-items-center rounded-full bg-gradient-to-br from-brand-500 to-navy-700 font-display text-xl font-bold text-white"
          aria-hidden="true"
        >
          {{ leader.name.charAt(0) }}
        </div>
        <h2 class="mb-1.5 text-[1.35rem]">{{ leader.name }}</h2>
        <p class="mb-3.5 font-display font-semibold text-brand-700">{{ leader.title }}</p>
        <p class="text-ink-muted">{{ leader.bio }}</p>
      </article>
    }
  </div>
</section>
