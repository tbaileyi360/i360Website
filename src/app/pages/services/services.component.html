<section class="page-hero">
  <div class="container-site relative z-[1]">
    <h1>Services</h1>
    <p>
      A full range of consulting and systems integration capabilities for federal financial,
      operational, and technology programs.
    </p>
  </div>
</section>

<section class="section-y">
  <div class="container-site grid gap-4">
    @for (service of services; track service.slug; let i = $index) {
      <article class="flex flex-col items-start justify-between gap-6 rounded-[20px] border border-transparent bg-surface px-5 py-6 transition hover:border-brand-100 hover:bg-white hover:shadow-sm sm:flex-row sm:items-center">
        <div>
          <span class="mb-1.5 inline-block font-display text-sm font-semibold text-brand-600">{{ i + 1 | number: '2.0-0' }}</span>
          <h2 class="mb-2 text-[clamp(1.25rem,2.4vw,1.6rem)]">{{ service.title }}</h2>
          <p class="max-w-3xl text-ink-muted">{{ service.summary }}</p>
        </div>
        <a class="btn btn-outline shrink-0" [routerLink]="['/services', service.slug]">View details</a>
      </article>
    }
  </div>
</section>
